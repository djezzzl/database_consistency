Layout:
  Metrics/LineLength:
    Max: 120

AllCops:
  NewCops: disable
  Exclude:
    - 'rails*-example/**/*'
    - 'bin/**/*'
    - 'vendor/bundle/**/*'
    - 'lib/database_consistency/report_builder.rb'
  TargetRubyVersion: 2.7

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 11
